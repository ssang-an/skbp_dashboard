<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKBP 사용자 관리</title>
    <link rel="icon" type="image/svg+xml" href="./src/sk-butterfly.svg?v=20260802-1" />
    <script>
      (() => {
        const stored = localStorage.getItem('skbp.ui.theme');
        document.documentElement.dataset.theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
    <link rel="stylesheet" href="./src/styles.css?v=20260803-guide-pill-height-1" />
  </head>
  <body>
    <div class="app-shell admin-shell">
      <header class="topbar">
        <a class="topbar-home-link" href="/" aria-label="홈 대시보드로 이동">
          <p class="eyebrow">SKBP Pipeline Finder</p>
          <h1>사용자 관리</h1>
        </a>
        <div class="top-actions" aria-label="사용자 관리 작업">
          <a class="secondary-link" href="/"><span aria-hidden="true">←</span><b>대시보드</b></a>
          <button class="theme-toggle icon-button" data-theme-toggle type="button" aria-label="라이트/다크 모드 전환"><span data-theme-icon aria-hidden="true">◐</span></button>
        </div>
      </header>

      <main class="admin-main">
        <section class="admin-summary" aria-label="사용자 현황">
          <article><span>전체 사용자</span><strong id="adminTotalUsers">-</strong></article>
          <article><span>활성 사용자</span><strong id="adminActiveUsers">-</strong></article>
          <article><span>현재 세션</span><strong id="adminActiveSessions">-</strong></article>
          <article><span>오늘 접속</span><strong id="adminTodayUsers">-</strong></article>
        </section>

        <section class="panel admin-users-panel">
          <div class="admin-toolbar">
            <div>
              <p class="eyebrow">ACCOUNT DIRECTORY</p>
              <h2>사용자 리스트</h2>
              <p>행을 선택하면 접속 및 사용 이력을 확인할 수 있습니다.</p>
            </div>
            <div class="admin-toolbar-actions">
              <label class="admin-search"><span class="sr-only">사용자 검색</span><input id="adminUserSearch" type="search" placeholder="이름 또는 이메일 검색" /></label>
              <button id="adminCsvExport" class="secondary-button" type="button">CSV 내보내기</button>
              <button id="adminRefresh" type="button">새로고침</button>
            </div>
          </div>
          <p id="adminStatus" class="admin-status" role="status" aria-live="polite"></p>
          <div class="admin-table-wrap">
            <table class="admin-user-table">
              <thead><tr>
                <th><button type="button" data-admin-sort="name">이름</button></th>
                <th><button type="button" data-admin-sort="email">이메일</button></th>
                <th><button type="button" data-admin-sort="active">상태</button></th>
                <th><button type="button" data-admin-sort="created_at">가입일</button></th>
                <th><button type="button" data-admin-sort="last_login_at">최근 로그인</button></th>
                <th><button type="button" data-admin-sort="last_seen_at">최근 접속</button></th>
                <th><button type="button" data-admin-sort="activity_count">활동 수</button></th>
                <th>관리</th>
              </tr></thead>
              <tbody id="adminUsersBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel admin-activity-panel">
          <div class="admin-activity-heading">
            <div><p class="eyebrow">ACCESS HISTORY</p><h2 id="adminActivityTitle">사용자를 선택해주세요</h2></div>
            <span id="adminActivityCount"></span>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-user-table admin-activity-table">
              <thead><tr><th>일시</th><th>활동</th><th>페이지</th><th>접속 IP</th></tr></thead>
              <tbody id="adminActivityBody"><tr><td colspan="4" class="admin-empty">사용자 행을 선택하면 이력이 표시됩니다.</td></tr></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./src/user-admin.js?v=20260802-user-admin-1"></script>
  </body>
</html>
