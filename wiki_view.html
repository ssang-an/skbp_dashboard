<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKBP Wiki Note</title>
    <link rel="icon" type="image/svg+xml" href="./src/sk-butterfly.svg?v=20260802-1" />
    <script>
      (() => {
        const stored = localStorage.getItem('skbp.ui.theme');
        const theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="./src/styles.css?v=20260805-topic-notes-1" />
  </head>
  <body>
    <div class="app-shell wiki-shell">
      <header class="topbar">
        <a class="topbar-home-link" href="/" aria-label="홈 대시보드로 이동">
          <p class="eyebrow">SKBP Pipeline Finder</p>
          <h1 id="wikiTitle">Wiki</h1>
        </a>
        <div class="top-actions" aria-label="Wiki actions">
          <div class="top-action-group top-primary-actions" role="group" aria-label="Wiki navigation">
            <a class="secondary-link" href="/"><span aria-hidden="true">←</span><b>Dashboard</b></a>
            <a class="secondary-link" id="rawWikiLink" target="_blank" rel="noreferrer" hidden><span aria-hidden="true">↗</span><b>Raw MD</b></a>
          </div>
          <div class="top-action-group top-data-actions" role="group" aria-label="Wiki status">
            <span class="status-pill" id="wikiStatus" role="status" aria-live="polite">Loading</span>
          </div>
          <button class="theme-toggle icon-button" data-theme-toggle type="button" aria-label="라이트/다크 모드 전환">
            <span data-theme-icon aria-hidden="true">◐</span>
            <span class="sr-only" data-theme-label>Dark</span>
          </button>
        </div>
      </header>

      <main class="wiki-layout">
        <section class="panel wiki-note-panel">
          <div class="panel-header">
            <div>
              <h2 id="wikiNoteTitle">Loading</h2>
              <p id="wikiNotePath">-</p>
            </div>
          </div>
          <article id="wikiNoteContent" class="wiki-note-content"></article>
        </section>
      </main>
    </div>

    <script type="module" src="./src/wiki_view.js?v=20260802-required-login-1"></script>
  </body>
</html>
